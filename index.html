<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensory Bliss // Lofi Deck</title>
    <style>
        :root { --neon-blue: #00f3ff; --dark-bg: #0a0a0c; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--dark-bg); color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
        body::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 20; background-size: 100% 2px, 3px 100%; pointer-events: none; }
        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; pointer-events: none; }
        #lofi-stream { position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh; transform: translate(-50%, -50%) scale(1.5); border: none; }
        .interface { position: relative; z-index: 30; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; box-sizing: border-box; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.6) 100%); }
        .header { border-left: 4px solid var(--neon-blue); padding-left: 15px; }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 4px; color: var(--neon-blue); }
        #clock { font-size: 4rem; font-weight: 900; text-shadow: 0 0 20px var(--neon-blue); }
        .controls { display: flex; gap: 20px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid #fff; color: #fff; padding: 10px 25px; cursor: pointer; font-family: inherit; transition: 0.3s; backdrop-filter: blur(5px); }
        button:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe id="lofi-stream" 
            src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&controls=0&loop=1&playlist=jfKfPfyJRdk&enablejsapi=1&origin=null" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <div class="interface">
        <div class="header">
            <h1>SENSORY BLISS // V.03</h1>
            <p>WISCONSIN_NODE_STATION</p>
            <div id="clock">00:00</div>
        </div>

        <div class="bottom-bar">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div class="controls">
                    <button onclick="unmute()">[ UNMUTE / WAKE UP ]</button>
                    <button onclick="changeStation()">[ NEXT VIBE ]</button>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.7rem; opacity: 0.5;">MONTELLO, WI // LOGGED</div>
                    <div>SIGNAL: STABLE</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('lofi-stream');
        const stations = ['jfKfPfyJRdk', 'py_wkguE9tA', '9hIG2En8g10', 'lP26UCnoH9s'];
        let currentIdx = 0;

        // Force a "Handshake" with the YouTube Iframe
        function unmute() {
            iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'unmute' }), '*');
            iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
        }

        function changeStation() {
            currentIdx = (currentIdx + 1) % stations.length;
            const id = stations[currentIdx];
            iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=0&controls=0&loop=1&playlist=${id}&enablejsapi=1&origin=null`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
