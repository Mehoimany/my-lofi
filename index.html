<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mehoimany's lofi // V.04</title>
    <style>
        :root { --neon-blue: #00f3ff; --dark-bg: #0a0a0c; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--dark-bg); color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* CRT Scanline Overlay */
        body::after { 
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); 
            z-index: 20; background-size: 100% 2px, 3px 100%; pointer-events: none; 
        }

        .video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; pointer-events: none; }
        #lofi-stream { position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh; transform: translate(-50%, -50%) scale(1.6); border: none; }
        
        .interface { 
            position: relative; z-index: 30; height: 100vh; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 40px; box-sizing: border-box; 
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.6) 100%); 
        }

        .header { border-left: 4px solid var(--neon-blue); padding-left: 15px; }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 4px; color: var(--neon-blue); text-transform: uppercase; }
        #clock { font-size: 4rem; font-weight: 900; text-shadow: 0 0 20px var(--neon-blue); }
        
        .controls { display: flex; gap: 15px; flex-wrap: wrap; }
        button { 
            background: rgba(255,255,255,0.05); border: 1px solid #fff; color: #fff; 
            padding: 12px 20px; cursor: pointer; font-family: inherit; transition: 0.3s; 
            backdrop-filter: blur(5px); font-size: 0.8rem; 
        }
        button:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }
        
        .status-box { text-align: right; line-height: 1.4; }
        #genre-display { color: var(--neon-blue); font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe id="lofi-stream" 
            src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&controls=0&loop=1&playlist=jfKfPfyJRdk&enablejsapi=1&origin=null" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <div class="interface">
        <div class="header">
            <h1>mehoimany's lofi</h1>
            <p>BROADCAST_MONTELLO_WI</p>
            <div id="clock">00:00</div>
        </div>

        <div class="bottom-bar">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div class="controls">
                    <button onclick="unmute()">[ WAKE UP ]</button>
                    <button onclick="changeGenre()" style="border-color: var(--neon-blue);">[ CHANGE VIBE ]</button>
                    <button onclick="nextInGenre()">[ KEEP VIBE ]</button>
                </div>
                <div class="status-box">
                    <div id="genre-display">GENRE: CLASSIC LOFI</div>
